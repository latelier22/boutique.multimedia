parameters:
  locale: fr_FR
  google_api_key: '%env(GOOGLE_API_KEY)%'
  google_cse_id:  '%env(GOOGLE_CSE_ID)%'
  hiboutik.account: '%env(string:HIBOUTIK_ACCOUNT)%'
  hiboutik.login:   '%env(string:HIBOUTIK_LOGIN)%'
  hiboutik.key:     '%env(string:HIBOUTIK_API_KEY)%'
  hiboutik.widget_secret: '%env(HIBOUTIK_WIDGET_SECRET)%'
  hiboutik.debug:   true
  $logger:     '@logger'
  tablet_socket_token: '%env(TABLET_SOCKET_TOKEN)%'
  tablet_pin: '%env(TABLET_PIN)%'
  tablet_link_secret: '%env(TABLET_LINK_SECRET)%'
  webhook_secret: '%env(WEBHOOK_SECRET)%'
  api_cache_base_url : 'env(API_CACHE_BASE_URL)'
  hiboutik_virtual_customer_id: 1251
  app.legacy_rachats_enabled: true

  app.intervention_start_at: 2001

  app.rachat_conditions_accept_label: "J'accepte les déclarations et conditions de cession ci-dessous."

  app.rachat_conditions_pdf: |
    Le vendeur déclare être le propriétaire légitime du bien cédé et avoir pleine capacité pour en disposer.
    Le vendeur déclare que le bien cédé n'est pas issu d'un vol, d'un recel, d'une fraude, d'une location non restituée ou d'un financement non soldé.
    Le vendeur déclare que les numéros d'identification communiqués (IMEI, numéro de série, référence) correspondent bien au matériel remis.
    Le vendeur déclare avoir signalé à l'acheteur les défauts connus, dysfonctionnements, casses, blocages, accessoires manquants et limitations éventuelles du matériel.
    Pour les appareils numériques, le vendeur déclare avoir retiré ses comptes, codes, verrous d'activation et protections à distance, et autorise l'effacement complet des données encore présentes sur le matériel.
    Le vendeur reconnaît céder le matériel en l'état décrit au dossier et recevoir ce jour le montant indiqué sur le présent bon selon le mode de paiement mentionné.

  app.rachat_conditions_tablet: |
    Je reconnais avoir pris connaissance des déclarations et conditions de cession.
    Je confirme être propriétaire légitime du matériel cédé.
    Je confirme que les identifiants indiqués correspondent bien au matériel remis.
    Je confirme avoir signalé les défauts connus et autorise l'effacement des données et comptes restants.
    Je confirme recevoir le montant indiqué selon le mode de paiement mentionné sur le bon de cession.


  arrivage_mailbox_host: '%env(string:ARRIVAGE_MAILBOX_HOST)%'
  arrivage_mailbox_user: '%env(string:ARRIVAGE_MAILBOX_USER)%'
  arrivage_mailbox_password: '%env(string:ARRIVAGE_MAILBOX_PASSWORD)%'

  rachats_columns:
    columns:
      select:   { label: "Sélection", default: true }
      id:       { label: "#",         default: true }
      modele:   { label: "Modèle",    default: true }
      prix:     { label: "Prix",      default: true }
      date:     { label: "Date",      default: true }
      nom:      { label: "Nom",       default: true }
      prenom:   { label: "Prénom",    default: false }
      tel:      { label: "Téléphone", default: true }
      email:    { label: "Email",     default: false }
      pdf:      { label: "PDF",       default: true }
      ci:       { label: "Pièce ID",  default: true }
      paiement: { label: "Paiement",  default: true }
      revendeur: { label: "Revendeur", default: true }
      actions:  { label: "Actions",   default: true }

    presets:
      desktop:  [select,id,modele,prix,date,nom,prenom,tel,email,pdf,ci,paiement,revendeur,actions]
      tablet:   [select,id,modele,prix,date,nom,tel,pdf,paiement,revendeur,actions]
      mobile:   [select,id,modele,prix,date,nom,tel,pdf,paiement,actions]
    
services:
   
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{Entity,Migrations,Tests,Kernel.php}'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Command\BackfillRachatArrivagesCommand:
        tags:
            - { name: 'console.command', command: 'app:backfill-rachat-arrivages' }

# define a service which will be used as the queue

    redis_connection_factory:
        class: Enqueue\Redis\RedisConnectionFactory

    App\Controller\Admin\SearchImageController:
        arguments:
            $googleApiKey: '%google_api_key%'
            $googleCseId:  '%google_cse_id%'

    App\Twig\ProductExtension:
        tags: ['twig.extension']
        public: true

    App\Service\ProductAssociationFilterService:
        public: true

    App\Twig\TaxonExtension:
        tags: ['twig.extension']
    
    App\Form\Extension\TaxonTypeExtension:
        tags:
        - { name: form.type_extension, extended_type: Sylius\Bundle\TaxonomyBundle\Form\Type\TaxonType }


    App\Controller\Admin\Product\CreateSimpleProductController:
            arguments:
                $productFactory: '@sylius.factory.product'
                $variantFactory: '@sylius.factory.product_variant'
                $channelPricingFactory: '@sylius.factory.channel_pricing'
                $productTaxonFactory: '@sylius.factory.product_taxon'
                $productRepository: '@sylius.repository.product'
                $variantRepository: '@sylius.repository.product_variant'
                $channelRepository: '@sylius.repository.channel'
                $taxonRepository: '@sylius.repository.taxon'
                $httpClient: '@http_client'
    
     # Client Hiboutik
    App\Service\HiboutikClient:
        arguments:
            $httpClient: '@http_client'
            $hibAccount: '%hiboutik.account%'
            $hibLogin:   '%hiboutik.login%'
            $hibApiKey:  '%hiboutik.key%'   # ⬅️ NOM QUI MATCHE le constructeur
            $debug:      '%hiboutik.debug%'
            $logger:     '@monolog.logger.hiboutik'
    
    monolog.logger.hiboutik:
        class: Monolog\Logger
        arguments: ['hiboutik']
    
    App\Service\RachatPdfGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $pdf: '@knp_snappy.pdf'


    App\Twig\AppExtension:
        tags: ['twig.extension']

    App\Twig\JsonExtension:
        tags: ['twig.extension']


    # App\Menu\Admin\HiboutikMenuListener:
    #     tags:
    #         - { name: kernel.event_listener, event: sylius.menu.admin.main, method: addAdminMenuItems }

 
    App\Menu\Admin\AdminMenuListener:
        arguments:
            $hiboutikAdminNavigation: '%app.admin_hiboutik_navigation%'
        tags:
            - { name: kernel.event_listener, event: sylius.menu.admin.main, method: addAdminMenuItems }
  

    # ⚠️ Toute sous-classe hérite automatiquement des args du parent
    App\Service\HiboutikTillClient:
        parent: App\Service\HiboutikClient

    App\Controller\Widget\HiboutikWidgetController:
        arguments:
            $account: '%hiboutik.account%'
            $login: '%hiboutik.login%'
            $apiKey: '%hiboutik.key%'
            $widgetSecret: '%hiboutik.widget_secret%'
        tags: ['controller.service_arguments']

    App\Service\CacheApiClient:
        arguments:
            $http: '@http_client'
            $baseUrl: '%env(API_CACHE_BASE_URL)%'
            $secret: '%env(WEBHOOK_SECRET)%'

    App\Service\SensitiveDataCipher:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Service\InterventionNumberGenerator:
        arguments:
            $startAt: '%app.intervention_start_at%'

    # App\Service\RachatDossierCustomerResolver:
    #     arguments:
    #         $hiboutikVirtualCustomerId: '%hiboutik_virtual_customer_id%'

    App\Controller\Admin\Hiboutik\ApiCacheController:
        arguments:
            $apiCacheBaseUrl: '%env(string:API_CACHE_BASE_URL)%'
            $webhook_secret: '%webhook_secret%'
    
    App\Service\Hiboutik\MobileImportParser: ~

    App\Service\Hiboutik\MobileImportProductCreator:
        arguments:
            - '@App\Service\HiboutikClient'



    App\Service\Hiboutik\ArrivageMailFetcher:
        arguments:
            $arrivageMailboxHost: '%arrivage_mailbox_host%'
            $arrivageMailboxUser: '%arrivage_mailbox_user%'
            $arrivageMailboxPassword: '%arrivage_mailbox_password%'